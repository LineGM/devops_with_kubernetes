apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-project-config
  namespace: project
data:
  HOST: 0.0.0.0
  PORT: "3000"
  APP_PATH: /
  IMAGE_PATH: /image
  TODOS_PATH: /todos
  TODO_API_URL: /todos
  IMAGE_URL: https://picsum.photos/1200
  IMAGE_CACHE_FILE: /usr/src/app/files/image.jpg
  IMAGE_CACHE_MAX_AGE_SECONDS: "600"
  IMAGE_MAX_BYTES: "20971520"
  IMAGE_DOWNLOAD_TIMEOUT_SECONDS: "30"
  MAX_TODO_LENGTH: "140"
  MAX_REQUEST_BYTES: "4096"
  DB_HOST: todo-postgres-svc
  DB_PORT: "5432"
  DB_NAME: todos
  DB_USER: todo
  DB_CONNECT_TIMEOUT_SECONDS: "5"
  DB_CONNECT_RETRIES: "30"
  DB_CONNECT_RETRY_DELAY_SECONDS: "2"
  WIKIPEDIA_RANDOM_URL: https://en.wikipedia.org/wiki/Special:Random
  TODO_BACKEND_URL: http://todo-backend-svc/todos
  TODO_REMINDER_PREFIX: "Read "
  HTTP_TIMEOUT_SECONDS: "15"
  MAX_RANDOM_ATTEMPTS: "10"
