apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:2.6
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: todo-project-config
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
